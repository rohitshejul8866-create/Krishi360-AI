AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  KRISHI360 AI backend — API Gateway + Lambda + DynamoDB + private S3 +
  Cognito + optional Bedrock. DESIGN TEMPLATE: review and deploy only with
  explicit approval. Nothing here is deployed by default.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Single origin used for the API Gateway CORS preflight responses.
  AllowedOrigins:
    Type: String
    Default: http://localhost:5173,http://localhost:4173
    Description: Comma-separated origins enforced by Lambda response headers. No wildcard.
  AiProvider:
    Type: String
    Default: disabled
    AllowedValues: [disabled, bedrock]
    Description: >
      disabled = analysis endpoint fails closed with 503. bedrock = real model
      invocation; requires model access granted in your account + BedrockModelId.
  BedrockModelId:
    Type: String
    Default: ''
    Description: e.g. anthropic.claude-3-5-sonnet-20241022-v2:0 (only after model access is granted).
  MaxUploadBytes:
    Type: Number
    Default: 5242880
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [debug, info, warn, error]

Conditions:
  BedrockEnabled: !Equals [!Ref AiProvider, bedrock]
  IsProd: !Equals [!Ref EnvironmentName, prod]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 15
    Environment:
      Variables:
        NODE_ENV: production
        AUTH_MODE: cognito
        DATA_BACKEND: dynamodb
        AWS_REGION: !Ref AWS::Region
        DYNAMODB_TABLE_NAME: !Ref KrishiTable
        UPLOAD_BUCKET_NAME: !Ref UploadBucket
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        AI_PROVIDER: !Ref AiProvider
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
        LOG_LEVEL: !Ref LogLevel

Resources:
  # ---------------------------------------------------------------- API ----
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /krishi360/${EnvironmentName}/api-access
      RetentionInDays: 30

  KrishiApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      EndpointConfiguration: REGIONAL
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt KrishiUserPool.Arn
      # Rate-limiting strategy: stage-wide throttling here; add per-client
      # usage plans / AWS WAF rate rules before production (docs/SECURITY.md).
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 25
          MetricsEnabled: true
        - ResourcePath: '/crop-cases/{id}/analysis'
          HttpMethod: POST
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","route":"$context.resourcePath","method":"$context.httpMethod","status":"$context.status","latencyMs":"$context.responseLatency"}'

  # ----------------------------------------------------------- Cognito ----
  KrishiUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub krishi360-${EnvironmentName}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OPTIONAL'
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  KrishiUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref KrishiUserPool
      ClientName: krishi360-web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  # Role groups. Assignment to expert/admin groups is an explicit admin act.
  FarmerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: farmer
      UserPoolId: !Ref KrishiUserPool
      Description: Farmers — access only their own records.
  ExpertGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: expert
      UserPoolId: !Ref KrishiUserPool
      Description: Experts — assigned cases and the unassigned review queue.
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref KrishiUserPool
      Description: Admins — explicit administrative operations.

  # ---------------------------------------------------------- DynamoDB ----
  KrishiTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: gsi2
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  # ------------------------------------------------------- Private S3 ----
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # ---------------------------------------------------------- Lambdas ----
  AuthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        EntryPoints: [src/handlers/auth.ts]
    Properties:
      Handler: src/handlers/auth.handler
      CodeUri: .
      Description: GET /health (public) and GET /me.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref KrishiTable
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref KrishiApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        Me:
          Type: Api
          Properties:
            RestApiId: !Ref KrishiApi
            Path: /me
            Method: GET

  CropDoctorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        EntryPoints: [src/handlers/cropCases.ts]
    Properties:
      Handler: src/handlers/cropCases.handler
      CodeUri: .
      Timeout: 30
      Description: CropDoctor AI — cases, presigned uploads, AI analysis, expert review.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KrishiTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub arn:${AWS::Partition}:s3:::${UploadBucket}/crops/*
        - !If
          - BedrockEnabled
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
          - !Ref AWS::NoValue
      Events:
        CreateCase:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/crop-cases', Method: POST }
        ListCases:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/crop-cases', Method: GET }
        GetCase:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/crop-cases/{id}', Method: GET }
        UploadUrl:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/crop-cases/{id}/upload-url', Method: POST }
        Analysis:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/crop-cases/{id}/analysis', Method: POST }
        ExpertReview:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/crop-cases/{id}/expert-review', Method: POST }

  MandiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        EntryPoints: [src/handlers/mandi.ts]
    Properties:
      Handler: src/handlers/mandi.handler
      CodeUri: .
      Description: MandiSmart — price reads for all roles, admin-only ingestion.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KrishiTable
      Events:
        ListPrices:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/mandi/prices', Method: GET }
        GetPrice:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/mandi/prices/{id}', Method: GET }
        CreatePrice:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/mandi/prices', Method: POST }

  JalSenseFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        EntryPoints: [src/handlers/farms.ts]
    Properties:
      Handler: src/handlers/farms.handler
      CodeUri: .
      Description: JalSense — farms, plots, manual soil readings, irrigation advice.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KrishiTable
      Events:
        CreateFarm:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/farms', Method: POST }
        ListFarms:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/farms', Method: GET }
        GetFarm:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/farms/{id}', Method: GET }
        AddReading:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/farms/{id}/readings', Method: POST }
        ListReadings:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/farms/{id}/readings', Method: GET }

  GrainGuardFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        EntryPoints: [src/handlers/storage.ts]
    Properties:
      Handler: src/handlers/storage.handler
      CodeUri: .
      Description: GrainGuard — storage batches, readings, alerts, inspections.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KrishiTable
      Events:
        CreateBatch:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/storage-batches', Method: POST }
        ListBatches:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/storage-batches', Method: GET }
        GetBatch:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/storage-batches/{id}', Method: GET }
        AddReading:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/storage-batches/{id}/readings', Method: POST }
        ListAlerts:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/storage-batches/{id}/alerts', Method: GET }
        AddInspection:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/storage-batches/{id}/inspections', Method: POST }

  SchemeSaathiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        EntryPoints: [src/handlers/schemes.ts]
    Properties:
      Handler: src/handlers/schemes.handler
      CodeUri: .
      Description: SchemeSaathi — scheme catalogue, eligibility check; admin audit-log reads.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref KrishiTable
      Events:
        ListSchemes:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/schemes', Method: GET }
        GetScheme:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/schemes/{id}', Method: GET }
        EligibilityCheck:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/schemes/eligibility-check', Method: POST }
        AuditLogs:
          Type: Api
          Properties: { RestApiId: !Ref KrishiApi, Path: '/audit-logs', Method: GET }

Outputs:
  ApiBaseUrl:
    Description: Base URL for the frontend VITE_API_BASE_URL.
    Value: !Sub https://${KrishiApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
  UserPoolId:
    Value: !Ref KrishiUserPool
  UserPoolClientId:
    Value: !Ref KrishiUserPoolClient
  TableName:
    Value: !Ref KrishiTable
  UploadBucketName:
    Value: !Ref UploadBucket